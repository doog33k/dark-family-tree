<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a227"/>
      <stop offset="50%" style="stop-color:#f4d03f"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="#0a0a0a"/>
  
  <!-- Triquetra symbol -->
  <g transform="translate(200, 180)" filter="url(#glow)">
    <!-- Three interlocking arcs -->
    <path d="M 0,-60 
             Q 52,-60 52,0 
             Q 52,52 0,52 
             Q -52,52 -52,0 
             Q -52,-60 0,-60" 
          fill="none" 
          stroke="url(#goldGradient)" 
          stroke-width="4"
          transform="rotate(0)"/>
    <path d="M 0,-60 
             Q 52,-60 52,0 
             Q 52,52 0,52 
             Q -52,52 -52,0 
             Q -52,-60 0,-60" 
          fill="none" 
          stroke="url(#goldGradient)" 
          stroke-width="4"
          transform="rotate(120)"/>
    <path d="M 0,-60 
             Q 52,-60 52,0 
             Q 52,52 0,52 
             Q -52,52 -52,0 
             Q -52,-60 0,-60" 
          fill="none" 
          stroke="url(#goldGradient)" 
          stroke-width="4"
          transform="rotate(240)"/>
    
    <!-- Center circle -->
    <circle cx="0" cy="0" r="8" fill="url(#goldGradient)"/>
  </g>
  
  <!-- DARK text -->
  <text x="200" y="300" 
        text-anchor="middle" 
        font-family="Cinzel, serif" 
        font-size="56" 
        font-weight="700"
        fill="url(#goldGradient)"
        filter="url(#glow)">DARK</text>
  
  <!-- Subtitle -->
  <text x="200" y="340" 
        text-anchor="middle" 
        font-family="Cinzel, serif" 
        font-size="14" 
        fill="#888"
        letter-spacing="4">ARBRE GÉNÉALOGIQUE</text>
</svg>
