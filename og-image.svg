<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a227"/>
      <stop offset="50%" style="stop-color:#f4d03f"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <filter id="glowEffect">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Decorative lines -->
  <line x1="100" y1="100" x2="1100" y2="100" stroke="#333" stroke-width="1"/>
  <line x1="100" y1="530" x2="1100" y2="530" stroke="#333" stroke-width="1"/>
  
  <!-- Triquetra symbol -->
  <g transform="translate(600, 250)" filter="url(#glowEffect)">
    <path d="M 0,-80 
             Q 69,-80 69,0 
             Q 69,69 0,69 
             Q -69,69 -69,0 
             Q -69,-80 0,-80" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="5"
          transform="rotate(0)"/>
    <path d="M 0,-80 
             Q 69,-80 69,0 
             Q 69,69 0,69 
             Q -69,69 -69,0 
             Q -69,-80 0,-80" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="5"
          transform="rotate(120)"/>
    <path d="M 0,-80 
             Q 69,-80 69,0 
             Q 69,69 0,69 
             Q -69,69 -69,0 
             Q -69,-80 0,-80" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="5"
          transform="rotate(240)"/>
    <circle cx="0" cy="0" r="10" fill="url(#goldGrad)"/>
  </g>
  
  <!-- DARK text -->
  <text x="600" y="420" 
        text-anchor="middle" 
        font-family="Cinzel, Georgia, serif" 
        font-size="72" 
        font-weight="700"
        fill="url(#goldGrad)"
        filter="url(#glowEffect)">DARK</text>
  
  <!-- Subtitle -->
  <text x="600" y="480" 
        text-anchor="middle" 
        font-family="Cinzel, Georgia, serif" 
        font-size="24" 
        fill="#888"
        letter-spacing="8">ARBRE GÉNÉALOGIQUE INTERACTIF</text>
  
  <!-- Tagline -->
  <text x="600" y="560" 
        text-anchor="middle" 
        font-family="Georgia, serif" 
        font-size="18" 
        fill="#666"
        font-style="italic">Sans spoilers • Épisode par épisode • 1953 - 1986 - 2019 - 2052</text>
</svg>
